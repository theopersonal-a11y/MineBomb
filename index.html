<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MineBomb - Pixel God Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="MineBomb: a pixel-art island world sandbox. Guide (or torment) tiny civilizations with 500+ abilities.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topbar">
    <div class="tb-group tb-left">
      <button id="btn-menu" class="tbtn" title="Worlds menu (Esc)">☰</button>
      <span id="world-name" class="tb-text" title="World name">World</span>
      <span id="clock" class="tb-text">Year 1 · Spring · Day 1</span>
      <span id="weather" class="tb-text">☀️ Clear</span>
    </div>
    <div class="tb-group tb-center">
      <button id="btn-pause" class="tbtn" title="Pause (Space)">⏸</button>
      <button class="tbtn speed" data-speed="1" title="Speed 1x">1×</button>
      <button class="tbtn speed" data-speed="2" title="Speed 2x">2×</button>
      <button class="tbtn speed" data-speed="5" title="Speed 5x">5×</button>
      <button class="tbtn speed" data-speed="10" title="Speed 10x">10×</button>
      <button class="tbtn speed" data-speed="25" title="Speed 25x">25×</button>
    </div>
    <div class="tb-group tb-right">
      <span id="stat-pop" class="tb-text" title="World population">👥 0</span>
      <span id="stat-civs" class="tb-text" title="Living civilizations">🏛️ 0</span>
      <span id="stat-ents" class="tb-text" title="Creatures">🐾 0</span>
      <div id="power-wrap" title="Divine power. Abilities cost power in Challenge mode."><div id="power-bar"></div><span id="power-text">∞</span></div>
      <button id="btn-inv" class="tbtn" title="Abilities (E)">🎒 <span class="lbl">Abilities</span></button>
      <button id="btn-civs" class="tbtn" title="Civilizations (C)">🏛️ <span class="lbl">Civs</span></button>
      <button id="btn-log" class="tbtn" title="Chronicle (L)">📜</button>
      <button id="btn-stats" class="tbtn" title="Statistics">📈</button>
      <button id="btn-settings" class="tbtn" title="Settings">⚙️</button>
      <button id="btn-help" class="tbtn" title="Help (H)">❔</button>
    </div>
  </div>

  <div id="feed"></div>

  <div id="minimap-wrap" title="Minimap: click to jump"><canvas id="minimap" width="220" height="150"></canvas></div>

  <div id="inspector" class="side-panel hidden"></div>

  <div id="bottom">
    <div id="ability-info"><span id="ab-icon"></span><span id="ab-name"></span><span id="ab-desc"></span></div>
    <div id="hotbar"></div>
    <div id="brush-row">
      <span id="brush-info">Brush <b id="brush-size">3</b> <small>[ ]</small></span>
      <span id="mode-hint" class="small">Left-click: use · Right-drag: pan · Scroll: zoom · Shift+click: inspect</span>
    </div>
  </div>

  <div id="toasts"></div>
</div>

<div id="modal" class="hidden">
  <div id="modal-box">
    <div id="modal-head"><span id="modal-title">Panel</span><button id="modal-close" class="tbtn" title="Close (Esc)">✕</button></div>
    <div id="modal-content"></div>
  </div>
</div>

<input type="file" id="import-file" accept=".json,application/json" style="display:none">

<script src="js/util.js"></script>
<script src="js/tiles.js"></script>
<script src="js/sprites.js"></script>
<script src="js/fx.js"></script>
<script src="js/entities.js"></script>
<script src="js/ai.js"></script>
<script src="js/ai_special.js"></script>
<script src="js/civs.js"></script>
<script src="js/civs_sim.js"></script>
<script src="js/lib.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/abilities.js"></script>
<script src="js/abilities2.js"></script>
<script src="js/abilities3.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
